[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "distributed-coloring-learning"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "networkx",
    "pandas",
]

[project.optional-dependencies]
dev = [
    "pytest",
]
study = [
    "torch>=2.5",
    "matplotlib",
    "scipy",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
